name: Examples - check

on:
    workflow_dispatch: {}
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.11'

            - name: Install ruff
              run: pip install ruff

            - name: Exempt first-party packages from release-age check
              run: pnpm config set minimumReleaseAgeExclude '@swmansion/*' --location=global

            - name: Check node-minimal example
              working-directory: ./node-minimal
              run: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run lint && pnpm run format:check

            - name: Check node-offline example
              working-directory: ./node-offline
              run: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run lint && pnpm run format:check

            - name: Check node-yolo-whisper (TS)
              working-directory: ./node-yolo-whisper
              run: pnpm install --frozen-lockfile && pnpm run build && pnpm run lint && pnpm run format:check

            - name: Check node-yolo-whisper sidecar (Python)
              working-directory: ./node-yolo-whisper/sidecar
              run: ruff check . && ruff format --check .

            - name: Check web-client-vite example
              working-directory: ./web-client-vite
              run: pnpm install --frozen-lockfile && pnpm run build && pnpm run lint

            - name: Check web-wasm-vite example
              working-directory: ./web-wasm-vite
              run: pnpm install --frozen-lockfile && pnpm run build && pnpm run lint

            - name: Check web-wasm-react-router example
              working-directory: ./web-wasm-react-router
              run: pnpm install --frozen-lockfile && pnpm run build && pnpm run typecheck

            - name: Check web-wasm-nextjs example
              working-directory: ./web-wasm-nextjs
              run: pnpm install --frozen-lockfile && pnpm run build && pnpm run lint
